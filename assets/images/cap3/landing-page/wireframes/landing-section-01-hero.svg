  <text x="662" y="61" class="nav">Producto</text><text x="760" y="61" class="nav">Para empleados y RR. HH.</text><text x="1018" y="61" class="nav">Planes</text><text x="1087" y="61" class="nav">Contacto</text><text x="1183" y="61" class="nav">Conócenos</text>
