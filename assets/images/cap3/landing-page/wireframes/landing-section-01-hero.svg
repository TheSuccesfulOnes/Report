<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>
    .line{stroke:#9a9a9a;stroke-width:2}.fill{fill:#ededed}.dark{fill:#353535}.text{font-family:Arial,sans-serif;fill:#454545}.tiny{font:700 13px Arial;letter-spacing:2px;fill:#777}.nav{font:700 16px Arial;fill:#555}.title{font:800 74px Arial;fill:#fff}.copy{font:22px Arial;fill:#fff}
