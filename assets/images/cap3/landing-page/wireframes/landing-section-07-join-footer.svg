  <style>.text{font-family:Arial,sans-serif;fill:#424242}.tiny{font:700 13px Arial;letter-spacing:2px;fill:#777}.muted{font:19px Arial;fill:#707070}.line{stroke:#aaa;stroke-width:2}</style>
  <rect width="1440" height="900" fill="#f8f8f8"/><rect width="1440" height="88" fill="#ededed" stroke="#b9b9b9"/><text x="48" y="53" class="text" font-size="20" font-weight="800">SafeSpace</text><text x="1190" y="53" class="tiny">CIERRE / FOOTER</text>
  <rect x="96" y="148" width="1248" height="402" fill="#e5e5e5" stroke="#aaa" stroke-dasharray="10 8"/><text x="720" y="240" text-anchor="middle" class="tiny">EMPIEZA CON SAFESPACE</text><text x="720" y="322" text-anchor="middle" class="text" font-size="62" font-weight="800">Haz del bienestar una parte</text><text x="720" y="392" text-anchor="middle" class="text" font-size="62" font-weight="800">de tu día.</text><text x="720" y="448" text-anchor="middle" class="muted">Únete a una forma más humana de escuchar, acompañar</text><text x="720" y="478" text-anchor="middle" class="muted">y cuidar a las personas y sus equipos.</text><rect x="616" y="500" width="208" height="42" fill="#555"/><text x="720" y="527" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Ver los planes  →</text>
  <rect y="650" width="1440" height="250" fill="#e5e5e5"/><text x="126" y="714" class="text" font-size="24" font-weight="800">SafeSpace</text><text x="126" y="747" class="tiny">Un espacio digital para acompañar el bienestar de las personas y sus equipos.</text><text x="126" y="812" class="tiny">NAVEGACIÓN DEL SITIO</text><text x="126" y="848" class="muted" font-size="16">Política de privacidad</text><text x="352" y="848" class="muted" font-size="16">Términos y condiciones</text><text x="612" y="848" class="muted" font-size="16">Política de uso de IA</text><text x="860" y="848" class="muted" font-size="16">Soporte</text><line x1="126" y1="870" x2="1314" y2="870" class="line"/><text x="720" y="892" text-anchor="middle" class="tiny">© 2026 SAFESPACE. TODOS LOS DERECHOS RESERVADOS.</text>
</svg>
