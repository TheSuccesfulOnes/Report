<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
  <style>.text{font-family:Arial,sans-serif;fill:#424242}.tiny{font:700 13px Arial;letter-spacing:2px;fill:#777}.muted{font:20px Arial;fill:#707070}.card{fill:#ededed;stroke:#999;stroke-width:2}.line{stroke:#aaa;stroke-width:2}</style>
  <rect width="1440" height="1100" fill="#f8f8f8"/><rect width="1440" height="88" fill="#ededed" stroke="#b9b9b9"/><text x="48" y="53" class="text" font-size="20" font-weight="800">SafeSpace</text><text x="1210" y="53" class="tiny">CONÓCENOS / EQUIPO</text>
  <text x="126" y="166" class="tiny">CONÓCENOS</text><text x="126" y="238" class="text" font-size="58" font-weight="800">Detrás de SafeSpace hay personas</text><text x="126" y="304" class="text" font-size="58" font-weight="800">que también escuchan.</text><text x="126" y="358" class="muted">Conoce al equipo que está construyendo un espacio más humano</text><text x="126" y="390" class="muted">para el bienestar laboral.</text>
  <rect x="126" y="454" width="540" height="148" class="card"/><rect x="696" y="454" width="618" height="148" class="card"/><text x="158" y="497" class="tiny">NUESTRA VISIÓN</text><text x="158" y="542" class="text" font-size="20" font-weight="700">Construir espacios de trabajo donde hablar del</text><text x="158" y="572" class="text" font-size="20" font-weight="700">bienestar sea natural, seguro y accionable.</text><text x="728" y="497" class="tiny">NUESTRA MISIÓN</text><text x="728" y="542" class="text" font-size="20" font-weight="700">Acompañar a personas y equipos con herramientas</text><text x="728" y="572" class="text" font-size="20" font-weight="700">claras para escuchar, orientar y actuar a tiempo.</text>
  <rect x="126" y="666" width="1188" height="320" class="card"/><text x="158" y="708" class="tiny">EQUIPO DE SAFESPACE</text><rect x="158" y="738" width="278" height="208" fill="#d3d3d3" stroke="#999" stroke-dasharray="8 7"/><text x="297" y="848" text-anchor="middle" class="tiny">RETRATO DEL PERFIL</text><text x="500" y="742" class="tiny">PERFIL 01 DE 05  ·  CAMBIO AUTOMÁTICO CADA 20 SEGUNDOS</text><text x="500" y="790" class="tiny">INGENIERÍA DE SOFTWARE Y PRODUCTO</text><text x="500" y="832" class="text" font-size="30" font-weight="800">Milenko Rubén Cayanchi Ávila</text><text x="500" y="874" class="muted" font-size="17">Estudiante de Ingeniería de Software, proactivo y comprometido</text><text x="500" y="902" class="muted" font-size="17">con la creación de soluciones tecnológicas que aporten valor.</text><circle cx="500" cy="944" r="8" fill="#666"/><circle cx="528" cy="944" r="8" fill="#c8c8c8"/><circle cx="556" cy="944" r="8" fill="#c8c8c8"/><circle cx="584" cy="944" r="8" fill="#c8c8c8"/><circle cx="612" cy="944" r="8" fill="#c8c8c8"/><rect x="1128" y="922" width="54" height="34" fill="#f8f8f8" stroke="#999"/><text x="1155" y="945" text-anchor="middle" class="text" font-size="18">‹</text><rect x="1192" y="922" width="54" height="34" fill="#f8f8f8" stroke="#999"/><text x="1219" y="945" text-anchor="middle" class="text" font-size="18">›</text>
</svg>
