  <style>.sans{font-family:Arial,sans-serif}.dark{fill:#213936}.muted{fill:#73817b}.coral{fill:#f47f70}.small{font:700 13px Arial;letter-spacing:2px}.body{font:19px Arial}</style>
  <rect width="1440" height="1040" fill="#f7f8f4"/><text x="126" y="140" class="sans small coral">○  EL PRODUCTO</text><text x="126" y="226" class="sans dark" font-size="62" font-weight="800">Un ecosistema para</text><text x="126" y="294" class="sans dark" font-size="62" font-weight="800">escuchar, acompañar</text><text x="126" y="362" class="sans dark" font-size="62" font-weight="800">y actuar.</text><text x="126" y="432" class="sans body dark">SafeSpace reúne en un solo espacio las herramientas que las</text><text x="126" y="464" class="sans body dark">personas y los equipos necesitan para cuidar el bienestar laboral.</text><text x="126" y="536" class="sans body muted">Desde el registro diario del estado de ánimo y las encuestas</text><text x="126" y="568" class="sans body muted">hasta los reportes, el chat de orientación general y la visión de</text><text x="126" y="600" class="sans body muted">Recursos Humanos, todo está conectado para hacer más clara la</text><text x="126" y="632" class="sans body muted">conversación sobre el bienestar.</text><line x1="720" y1="110" x2="720" y2="900" stroke="#d5ded9"/>
  <path d="M1240 100 1400 260 1240 420" fill="none" stroke="#dbe7df" stroke-width="2"/>
  <g filter="url(#shadow02b)"><rect x="766" y="172" width="506" height="346" rx="16" fill="#173530"/><rect x="784" y="190" width="470" height="300" rx="10" fill="#fff"/><image href="../../../cap5/web/frontend-hr-home.png" x="784" y="190" width="470" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen02a)"/><rect x="852" y="392" width="488" height="310" rx="16" fill="#173530"/><rect x="870" y="410" width="430" height="270" rx="10" fill="#fff"/><image href="../../../cap5/web/frontend-web-mood.png" x="870" y="410" width="430" height="270" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen02b)"/><rect x="950" y="332" width="158" height="306" rx="24" fill="#173530"/><rect x="966" y="350" width="126" height="268" rx="20" fill="#fff"/><image href="../../../cap5/mobile/mobile-home.png" x="966" y="350" width="126" height="268" preserveAspectRatio="xMidYMid slice" clip-path="url(#phone02a)"/><rect x="1094" y="338" width="158" height="306" rx="24" fill="#173530"/><rect x="1110" y="356" width="126" height="268" rx="20" fill="#fff"/><image href="../../../cap5/mobile/mobile-surveys-overview.png" x="1110" y="356" width="126" height="268" preserveAspectRatio="xMidYMid slice" clip-path="url(#phone02b)"/></g>
  <text x="126" y="822" class="sans dark" font-size="26" font-weight="800">para cuidar el bienestar laboral.</text><text x="126" y="872" class="sans body muted">Una experiencia conectada para personas, equipos</text><text x="126" y="904" class="sans body muted">y Recursos Humanos.</text>
