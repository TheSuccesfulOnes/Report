  <rect width="1440" height="900" fill="#f7f8f4"/><rect width="1440" height="382" fill="#f47f70"/><text x="126" y="96" class="sans small dark">○  EMPIEZA CON SAFESPACE</text><text x="126" y="180" class="sans dark" font-size="62" font-weight="800">Haz del bienestar</text><text x="126" y="248" class="sans dark" font-size="62" font-weight="800">una parte de tu día.</text><text x="126" y="306" class="sans body dark">Únete a una forma más humana de escuchar, acompañar y cuidar a las</text><text x="126" y="336" class="sans body dark">personas y sus equipos.</text><rect x="1030" y="178" width="250" height="58" rx="2" fill="#213936"/><text x="1155" y="214" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#fff">Ver los planes  →</text>
