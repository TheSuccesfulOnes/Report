<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180">
  <style>.sans{font-family:Arial,sans-serif}.dark{fill:#213936}.muted{fill:#73817b}.coral{fill:#f47f70}.small{font:700 13px Arial;letter-spacing:2px}.body{font:18px Arial}</style>
  <rect width="1440" height="1180" fill="#fff"/><text x="126" y="152" class="sans small coral">○  CONÓCENOS</text><text x="126" y="226" class="sans dark" font-size="62" font-weight="800">Detrás de SafeSpace</text><text x="126" y="294" class="sans dark" font-size="62" font-weight="800">hay personas que</text><text x="126" y="362" class="sans dark" font-size="62" font-weight="800">también escuchan.</text><text x="126" y="428" class="sans body muted">Conoce al equipo que está construyendo un</text><text x="126" y="458" class="sans body muted">espacio más humano para el bienestar laboral.</text>
  <line x1="126" y1="540" x2="658" y2="540" stroke="#d5ded9"/><line x1="716" y1="540" x2="1314" y2="540" stroke="#d5ded9"/><text x="126" y="580" class="sans small coral">NUESTRA VISIÓN</text><text x="126" y="620" class="sans body muted">Construir espacios de trabajo donde hablar del bienestar sea</text><text x="126" y="650" class="sans body muted">natural, seguro y accionable.</text><text x="716" y="580" class="sans small coral">NUESTRA MISIÓN</text><text x="716" y="620" class="sans body muted">Acompañar a personas y equipos con herramientas claras para</text><text x="716" y="650" class="sans body muted">escuchar, orientar y actuar a tiempo.</text>
  <rect x="126" y="728" width="1188" height="360" fill="#213936"/><image href="../../../cap1/team/Milenko.jpeg" x="126" y="728" width="594" height="360" preserveAspectRatio="xMidYMid slice"/><rect x="720" y="728" width="594" height="360" fill="#213936"/><text x="1174" y="766" text-anchor="end" class="sans small" fill="#a9c9ae">CAMBIO AUTOMÁTICO CADA 20 SEGUNDOS</text><text x="760" y="844" class="sans small" fill="#a9c9ae">INGENIERÍA DE SOFTWARE Y PRODUCTO</text><text x="760" y="890" class="sans" font-size="36" font-weight="800" fill="#fff">Milenko Rubén</text><text x="760" y="932" class="sans" font-size="36" font-weight="800" fill="#fff">Cayanchi Ávila</text><text x="760" y="978" class="sans body" fill="#c7d9cb">Estudiante de Ingeniería de Software, proactivo y</text><text x="760" y="1008" class="sans body" fill="#c7d9cb">comprometido con la creación de soluciones tecnológicas</text><text x="760" y="1038" class="sans body" fill="#c7d9cb">que aporten valor al bienestar.</text><rect x="760" y="1060" width="36" height="5" rx="2" fill="#f47f70"/><rect x="808" y="1060" width="36" height="5" rx="2" fill="#6c8780"/><rect x="856" y="1060" width="36" height="5" rx="2" fill="#6c8780"/><rect x="904" y="1060" width="36" height="5" rx="2" fill="#6c8780"/><rect x="952" y="1060" width="36" height="5" rx="2" fill="#6c8780"/>
</svg>
