<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <style>.sans{font-family:Arial,sans-serif}.dark{fill:#213936}.muted{fill:#73817b}.coral{fill:#f47f70}.small{font:700 13px Arial;letter-spacing:2px}.body{font:19px Arial}</style>
  <rect width="1440" height="1000" fill="#f7f8f4"/><text x="126" y="148" class="sans small coral">○  PARA EMPLEADOS Y RECURSOS HUMANOS</text><text x="126" y="226" class="sans dark" font-size="62" font-weight="800">Una misma plataforma,</text><text x="126" y="294" class="sans dark" font-size="62" font-weight="800">dos formas de acompañar.</text><text x="126" y="356" class="sans body muted">SafeSpace conecta el bienestar cotidiano de las personas con</text><text x="126" y="388" class="sans body muted">señales útiles para que Recursos Humanos pueda escuchar y actuar.</text>
  <rect x="126" y="516" width="594" height="372" fill="#fff" stroke="#d5ded9"/><rect x="720" y="516" width="594" height="372" fill="#213936"/><text x="166" y="568" class="sans small muted">PARA EMPLEADOS</text><line x1="166" y1="594" x2="680" y2="594" stroke="#e2e8e3"/><text x="166" y="682" class="sans dark" font-size="36" font-weight="800">Un espacio para sentirte</text><text x="166" y="724" class="sans dark" font-size="36" font-weight="800">escuchado.</text><text x="760" y="568" class="sans small" fill="#a9c9ae">PARA RECURSOS HUMANOS</text><line x1="760" y1="594" x2="1274" y2="594" stroke="#55706a"/><text x="760" y="682" class="sans" font-size="36" font-weight="800" fill="#fff">Señales para acompañar</text><text x="760" y="724" class="sans" font-size="36" font-weight="800" fill="#fff">mejor a tu equipo.</text><text x="166" y="842" class="sans small coral">ESCUCHA · PARTICIPACIÓN · ACCIÓN</text><text x="760" y="842" class="sans small" fill="#f47f70">VISIBILIDAD · SEGUIMIENTO · DECISIONES</text>
</svg>
