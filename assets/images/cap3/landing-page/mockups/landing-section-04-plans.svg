<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160">
  <style>.sans{font-family:Arial,sans-serif}.dark{fill:#213936}.muted{fill:#73817b}.coral{fill:#f47f70}.green{fill:#a9c9ae}.small{font:700 13px Arial;letter-spacing:2px}.body{font:18px Arial}</style>
  <rect width="1440" height="1160" fill="#fff"/><text x="126" y="140" class="sans small coral">○  PLANES</text><text x="126" y="220" class="sans dark" font-size="62" font-weight="800">Elige el ritmo que mejor</text><text x="126" y="288" class="sans dark" font-size="62" font-weight="800">encaje con tu organización.</text><text x="126" y="354" class="sans body muted">Elige una modalidad flexible para acompañar</text><text x="126" y="386" class="sans body muted">el bienestar de tu equipo durante todo el año.</text><text x="1100" y="178" text-anchor="middle" class="sans small muted">MOSTRAR PRECIOS EN</text><rect x="982" y="202" width="238" height="48" rx="24" fill="#eef4ee" stroke="#cad8ce"/><rect x="990" y="210" width="110" height="32" rx="16" fill="#213936"/><text x="1045" y="231" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#fff">S/ Soles</text><text x="1155" y="231" text-anchor="middle" class="sans" font-size="12" fill="#73817b">US$ Dólares</text><text x="1100" y="278" text-anchor="middle" class="sans" font-size="11" fill="#9aa9a2">Conversión referencial: 1 US$ = S/3.75</text>
  <rect x="126" y="492" width="594" height="530" fill="#fff" stroke="#d5ded9"/><rect x="720" y="492" width="594" height="530" fill="#213936"/><text x="166" y="546" class="sans small coral">MODALIDAD MENSUAL</text><text x="166" y="614" class="sans dark" font-size="42" font-weight="800">Mensual</text><text x="166" y="652" class="sans body muted">Flexibilidad para comenzar a cuidar el bienestar</text><text x="166" y="682" class="sans body muted">de tu equipo mes a mes.</text><text x="166" y="784" class="sans dark" font-size="72" font-weight="800">20</text><text x="166" y="814" class="sans body muted">S/  / mes</text><line x1="166" y1="850" x2="680" y2="850" stroke="#d5ded9"/><text x="166" y="890" class="sans" font-size="15" fill="#d78878">✓</text><text x="190" y="890" class="sans" font-size="15" fill="#73817b">Acceso a las herramientas de bienestar</text><text x="166" y="922" class="sans" font-size="15" fill="#d78878">✓</text><text x="190" y="922" class="sans" font-size="15" fill="#73817b">Seguimiento del estado de ánimo</text><text x="166" y="954" class="sans" font-size="15" fill="#d78878">✓</text><text x="190" y="954" class="sans" font-size="15" fill="#73817b">Orientación general cuando la necesites</text><text x="166" y="990" class="sans" font-size="15" font-weight="700" fill="#213936">Elegir este plan</text><text x="672" y="990" text-anchor="end" class="sans" font-size="20" fill="#f47f70">↗</text>
  <text x="760" y="546" class="sans small" fill="#a9c9ae">MODALIDAD ANUAL</text><rect x="1180" y="520" width="94" height="28" rx="14" fill="#f47f70"/><text x="1227" y="538" text-anchor="middle" class="sans" font-size="10" font-weight="700" fill="#213936">MEJOR VALOR</text><text x="760" y="614" class="sans" font-size="42" font-weight="800" fill="#fff">Anual</text><text x="760" y="652" class="sans body" fill="#9bb2a8">Acompañamiento continuo para construir una cultura</text><text x="760" y="682" class="sans body" fill="#9bb2a8">de bienestar sostenible.</text><text x="760" y="784" class="sans" font-size="72" font-weight="800" fill="#fff">150</text><text x="760" y="814" class="sans body" fill="#9bb2a8">S/  / año</text><line x1="760" y1="850" x2="1274" y2="850" stroke="#55706a"/><text x="760" y="890" class="sans" font-size="15" fill="#f47f70">✓</text><text x="784" y="890" class="sans" font-size="15" fill="#dbe7df">Acceso a las herramientas de bienestar</text><text x="760" y="922" class="sans" font-size="15" fill="#f47f70">✓</text><text x="784" y="922" class="sans" font-size="15" fill="#dbe7df">Seguimiento del estado de ánimo</text><text x="760" y="954" class="sans" font-size="15" fill="#f47f70">✓</text><text x="784" y="954" class="sans" font-size="15" fill="#dbe7df">Orientación general cuando la necesites</text><text x="760" y="986" class="sans" font-size="15" fill="#f47f70">✓</text><text x="784" y="986" class="sans" font-size="15" fill="#dbe7df">Ahorra frente a 12 pagos mensuales</text><text x="760" y="1010" class="sans" font-size="15" font-weight="700" fill="#fff">Elegir este plan</text><text x="1264" y="1010" text-anchor="end" class="sans" font-size="20" fill="#f47f70">↗</text>
</svg>
